[project]
name = "simple-rag-app"
version = "0.1.0"
description = "A simple RAG API built with FastAPI"
requires-python = ">=3.14"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sentence-transformers",
    "numpy",
    "openai",
    "python-dotenv",
]

[dependency-groups]
lint = [
    "ruff>=0.16.0",
]
test = [
    "pytest>=8.0.0",
    "httpx",
]

[tool.pytest.ini_options]
pythonpath = ["apps"]
testpaths = ["tests"]
